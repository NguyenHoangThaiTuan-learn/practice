server:
  port: 8080

spring:
  application:
    name: backend

  datasource:
    username: postgres
    password: 123456
    url: jdbc:postgresql://localhost:5432/products

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
